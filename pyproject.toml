[project]
name = "creo"
version = "2.0.0"
description = "Creator Success AI Platform - AI-powered creator onboarding and management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "langchain-chroma>=1.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "requests>=2.31.0",
]
[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0.0"]

[tool.setuptools.packages.find]
include = ["creo*", "api*"]
